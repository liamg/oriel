name: release

# A v-tag makes a release: the app for each platform, each with its Linux sandbox helper embedded (make build), and
# a manifest signed for the updater (distribution.md). A tag with a "-" (v0.5.0-rc.1) is a pre-release, on nightly.
#
# Needs the repository secret ORIEL_RELEASE_KEY (the ed25519 key, hex) and the variable ORIEL_RELEASE_PUBKEYS (its
# public half, hex; two, comma-separated, during a rotation), which the builds trust. Oriel.app is signed with the
# secrets MACOS_SIGNING_P12 (the self-signed identity's .p12, base64) and MACOS_SIGNING_PASSWORD (its password), from
# scripts/macos-signing-cert.sh; without them it's signed ad hoc.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft --title "$TAG" --generate-notes $pre

  linux:
    needs: draft
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            zig: zig-x86_64-linux-0.16.0
            sum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - arch: arm64
            runner: ubuntu-24.04-arm
            zig: zig-aarch64-linux-0.16.0
            sum: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Install Gio's Linux deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: Install zig 0.16.0
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/0.16.0/${{ matrix.zig }}.tar.xz"
          echo "${{ matrix.sum }}  zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - run: term/ghostty/native/build.sh linux_${{ matrix.arch }}
      - run: make build VERSION="$TAG" RELEASE_KEYS="${{ vars.ORIEL_RELEASE_PUBKEYS }}"
      - run: |
          mkdir dist && mv bin/oriel "dist/oriel-linux-${{ matrix.arch }}"
          gh release upload "$TAG" dist/*

  macos:
    # One Apple-silicon runner builds both Macs: zig and clang cross-compile the Intel build. Each is uploaded as the
    # binary (for the CLI), Oriel.app as the updater's bundle (a .tar.gz of paths relative to the bundle), and a DMG.
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Install zig 0.16.0
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  zig.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - run: term/ghostty/native/build.sh darwin_arm64 darwin_amd64
      - name: Import the signing identity
        # The self-signed identity (scripts/macos-signing-cert.sh) goes into a keychain of its own for this job.
        # Without it the app is signed ad hoc, and macOS asks again for its privacy and keychain grants after
        # every update.
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 isn't set: Oriel.app is signed ad hoc"
            echo "CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 24)
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # The certificate's SHA-1 names it exactly; a self-signed one isn't trusted, so not -v.
          id=$(security find-identity -p codesigning "$kc" | awk '$1 ~ /^[0-9]+\)$/ { print $2; exit }')
          if [ -z "$id" ]; then
            echo "::error::MACOS_SIGNING_P12 has no code-signing identity"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - run: |
          mkdir dist
          for arch in arm64 amd64; do
            CGO_ENABLED=1 make dmg GOARCH=$arch VERSION="$TAG" RELEASE_KEYS="${{ vars.ORIEL_RELEASE_PUBKEYS }}" CODESIGN_IDENTITY="$CODESIGN_IDENTITY"
            cp bin/oriel "dist/oriel-darwin-$arch"
            COPYFILE_DISABLE=1 tar --no-mac-metadata -C bin/Oriel.app -czf "dist/oriel-darwin-$arch.app.tar.gz" .
            mv bin/Oriel-*-$arch.dmg dist/
          done
          gh release upload "$TAG" dist/*
      - name: Delete the signing keychain
        if: always()
        run: if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN"; fi

  publish:
    # The manifest lists every binary and bundle with its sha256, signed; then the draft goes out. The DMGs
    # (Oriel-*.dmg) are for first install, not the updater, so they aren't downloaded or listed.
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - run: |
          gh release download "$TAG" --pattern 'oriel-*' --dir dist
          gh release view "$TAG" --json body --jq .body > notes.md
      - run: go run ./tools/cmd/release -version "$TAG" -in dist -out release -notes notes.md
        env:
          ORIEL_RELEASE_KEY: ${{ secrets.ORIEL_RELEASE_KEY }}
      - run: |
          gh release upload "$TAG" release/manifest.json release/manifest.sig
          gh release edit "$TAG" --draft=false
