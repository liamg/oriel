name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs it before building

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Install Gio's Linux deps, Mesa and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev libgl1-mesa-dri xvfb
      - run: make check
        env:
          ORIEL_LEAK_DENYLIST: ${{ secrets.ORIEL_LEAK_DENYLIST }}
      - name: Install delve and debugpy, so the dap tests run live too
        shell: bash
        run: |
          go install github.com/go-delve/delve/cmd/dlv@v1.27.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL -o debugpy.whl https://files.pythonhosted.org/packages/56/3d/c7dc9f35bc9e22cdb53679f844bee40fd5cff871862f60595869a433400d/debugpy-1.8.22-py2.py3-none-any.whl
          echo "a9e9d3550e15ca479c59333e90845029190531f0cacfedab3b815a57bd913947  debugpy.whl" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/py" && unzip -q debugpy.whl -d "$RUNNER_TEMP/py"
          echo "PYTHONPATH=$RUNNER_TEMP/py" >> "$GITHUB_ENV"
      # macOS runners have three cores: two test packages at once, so their windows don't starve each other.
      - name: make test (under Xvfb on Linux, for render/gio's window test)
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a make test; else GOFLAGS=-p=2 make test; fi
      - name: Snapshot and lag suites with the frame-path I/O check
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a make test-framecheck; else GOFLAGS=-p=2 make test-framecheck; fi
      - name: Race detector on the packages where it's quick
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on ./text/... ./toml/... ./semver/... ./regex/... ./update/... ./registry/... ./core/... ./lsp/... ./dap/... ./fswatch/... ./gitx/...
      - name: Install zig 0.16.0, for the native libraries make build links
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=zig-x86_64-linux-0.16.0; sum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            macOS) asset=zig-aarch64-macos-0.16.0; sum=b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489 ;;
          esac
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/0.16.0/$asset.tar.xz"
          echo "$sum  zig.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - run: make native
      - run: make build
      - name: Install nvim for the oracle
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=nvim-linux-x86_64; sum=38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 ;;
            macOS) asset=nvim-macos-arm64; sum=9c84686ce84bbab725ff3d88ca3ac1d6da5a72128b68d9dd8094e34d4049a126 ;;
          esac
          curl -sSfL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/v0.11.7/$asset.tar.gz"
          echo "$sum  nvim.tar.gz" | shasum -a 256 -c -
          tar -xzf nvim.tar.gz -C "$RUNNER_TEMP"
          echo "ORIEL_NVIM=$RUNNER_TEMP/$asset/bin/nvim" >> "$GITHUB_ENV"
      - run: make oracle

  diag-budget:
    # TEMPORARY: why TestCompiledFromCacheBudget runs slow on the ubuntu-latest runner. Remove before merging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: The machine
        run: |
          nproc; lscpu | grep -E 'Model name|MHz|^CPU\(s\)|Hypervisor|Virtualization' || true
          echo "TMPDIR=${TMPDIR:-unset} RUNNER_TEMP=$RUNNER_TEMP"; df -hT /tmp "$RUNNER_TEMP" || true
          mount | grep -E ' /tmp | / ' || true
          dd if=/dev/zero of=/tmp/dd.bin bs=1M count=64 conv=fsync 2>&1 | tail -1
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
          dd if=/tmp/dd.bin of=/dev/null bs=1M 2>&1 | tail -1; rm -f /tmp/dd.bin
      - name: Each stage of a cached open, and the budget test with a CPU profile
        run: |
          ORIEL_DIAG=1 go test ./syntax/ -run 'TestZZDiagCachedOpenStages$' -count=3 -v | grep -E 'round 0|best of|cache dir'
          go test ./syntax/ -run 'TestCompiledFromCacheBudget$' -count=10 -v -cpuprofile "$RUNNER_TEMP/cpu.out" | grep -E 'first open|took'
          go tool pprof -top -nodecount=35 syntax.test "$RUNNER_TEMP/cpu.out" 2>/dev/null | head -45 || go tool pprof -top -nodecount=35 "$RUNNER_TEMP/cpu.out" | head -45
      - name: The same with the cache on a RAM disk
        run: |
          sudo mkdir -p /mnt/ram && sudo mount -t tmpfs -o size=256m tmpfs /mnt/ram && sudo chmod 1777 /mnt/ram
          TMPDIR=/mnt/ram ORIEL_DIAG=1 go test ./syntax/ -run 'TestZZDiagCachedOpenStages$' -count=3 -v | grep -E 'best of|cache dir'

  grammars:
    # The tree-sitter grammars and grammar packs are rebuilt from their pinned sources and must match what's
    # committed; the packs the binary's PACKS.SHA256SUMS lists are published as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install wasi-sdk 34
        run: |
          curl -sSfL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: syntax/grammars/build.sh
      # The .wasm.gz bytes depend on gzip's version; what's built is checked by its checksums, and the Go tests
      # check that what's embedded decompresses to the same.
      - run: git diff --exit-code -- syntax/grammars/SHA256SUMS syntax/grammars/manifest.tsv syntax/grammars/licenses syntax/grammars/PACKS.SHA256SUMS syntax/grammars/packs.tsv syntax/grammars/packs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grammar-packs
          path: |
            syntax/grammars/packs-out/*.tar.gz
            syntax/grammars/PACKS.SHA256SUMS
          if-no-files-found: error

  ghostty:
    # libghostty-vt is rebuilt from its pinned commit: the wasm must match what's committed, and the native library
    # (not committed) must pass the same suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zig 0.16.0
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"
      - run: term/ghostty/wasm/build.sh
      - run: git diff --exit-code -- term/ghostty/wasm/SHA256SUMS
      - run: term/ghostty/native/build.sh linux_amd64
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - run: make test-vt

  whisper:
    # whisper.cpp is built from its pinned release (voice/native/build.sh) and transcribes a clip with tiny.en.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: voice/native/build.sh linux_amd64
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Download the tiny.en model
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ggml-tiny.en.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.en.bin
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  $RUNNER_TEMP/ggml-tiny.en.bin" | sha256sum -c -
          echo "ORIEL_WHISPER_MODEL=$RUNNER_TEMP/ggml-tiny.en.bin" >> "$GITHUB_ENV"
      - run: make test-voice

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Install Gio's Linux deps, which loading its cgo packages needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - run: make vulncheck
