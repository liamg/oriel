id          = "liamg/linear"
version     = "0.1.0"
oriel       = ">=0.4"
description = "Linear in Oriel: your assigned tickets in the omnibox, Start work from a ticket, its state moved as the work goes, the PR linked back, and your tickets for the assistant"
license     = "MIT"
binaries    = ["darwin/arm64", "darwin/amd64", "linux/amd64", "linux/arm64"]
lazy        = { commands = ["Linear*", "linear.*"], events = ["SessionStart", "PrSeen"], omnibox = ["tickets"] }

[permissions]
net            = { hosts = ["api.linear.app"], why = "Read your tickets and move them, through Linear's API" }
secrets        = { LINEAR_TOKEN = "api.linear.app", why = "Your Linear API key, sent only to api.linear.app" }
"agent.tools"  = { tools = ["my_tickets"], why = "Tell the assistant which tickets are assigned to you" }
"agent.prompt" = { why = "Hand the ticket you start work from, with its comments and attachments, to the agent" }
