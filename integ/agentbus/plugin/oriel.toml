id          = "liamg/agentbus"
version     = "0.1.0"
oriel       = ">=0.4"
description = "agentbus: other people's agents' questions and review requests in your inbox, answered by your agent when you're away; your presence; the bus's log"
license     = "MIT"
binaries    = ["darwin/arm64", "darwin/amd64", "linux/amd64", "linux/arm64"]

[permissions]
net            = { hosts = ["*:80", "*:443", "api.github.com"], why = "Reach agentbus on your tailnet (wherever plugin.agentbus.url says it is), and GitHub for review requests" }
secrets        = { GITHUB_TOKEN = "api.github.com", why = "Read a review request's pull request, approve one an auto-approve rule passes, and see the reviews you submit on GitHub, sent only to api.github.com" }
exec           = { commands = ["tailscale"], why = "Find your tailnet's name, to find agentbus on it" }
"agent.tools"  = { tools = ["request_review", "review_requests.agentbus"], why = "Let the assistant ask for a review on agentbus, and see the requests waiting on you" }
"agent.prompt" = { why = "Ask your agent to answer a question you didn't get to before its deadline" }
