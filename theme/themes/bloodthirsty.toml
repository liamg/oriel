# Bloodthirsty: bone on black, cut with arterial red. Panels and rules are dried blood; text is bone white for
# contrast; red is kept for what should hit: keywords, the accent, and "needs you", the brightest red of all.
name = "bloodthirsty"
extends = "oriel"
variant = "dark"

[effects]
glow = 1

[component]
"selection"      = { color = "alpha(accent, 55%)", on = "bg.base" }
"text.selection" = "alpha(accent, 55%)"

[palette]
bg0 = "#000000"
bg1 = "#130505"
bg2 = "mix(bg1, bg3, 45%)"
bg3 = "#1f0606"
bg4 = "#360909"
line  = "#2a0707"
line2 = "#4d0b0b"
fg      = "#ede6df"
fg2     = "#b9aca5"
fg3     = "#80696a"
fg4     = "#5c4446"
accent  = "#d40f1c"
accent2 = "#6b0008"
ink     = "#ffffff"
brand   = "#e0101e"
green   = "#5fdc7a"
amber   = "#ff9a1f"
red     = "#ff2323"
cyan    = "#4fd8e0"
violet  = "#b57afc"
pink    = "#ff8ad0"
blue    = "#508eff"
"syn.keyword"   = "#ff2a35"
"syn.string"    = "#c9583f"
"syn.number"    = "#ff9a1f"
"syn.function"  = "#ffffff"
"syn.type"      = "#a3b1bf"
"syn.comment"   = "#6e4a48"
"syn.punct"     = "#b8222c"
"syn.variable"  = "#ede6df"
