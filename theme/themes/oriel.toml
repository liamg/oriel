# Oriel's built-in theme: black, yellow and a little orange; and a light variant.
# Values match the reference mockups (testdata/mockups).
name = "oriel"

[syntax]
"@keyword"     = "syn.keyword"
"@string"      = "syn.string"
"@number"      = "syn.number"
"@function"    = "syn.function"
"@type"        = "syn.type"
"@comment"     = { fg = "syn.comment", italic = true }
"@punctuation" = "syn.punct"
"@operator"    = "syn.punct"
"@variable"    = "syn.variable"

[dark.palette]
bg0 = "#060606"
bg1 = "#0c0c0b"
bg2 = "#121210"
bg3 = "#191815"
bg4 = "#23211c"
line  = "#24221d"
line2 = "#332f27"
fg  = "#ece6d8"
fg2 = "#b3ab99"
fg3 = "#7c7566"
fg4 = "#4f4a40"
accent  = "#ffd23f"
accent2 = "#e0a800"
ink     = "#141006"
brand   = "#ff8a1f"
green  = "#4fe0a0"
amber  = "#ff9b45"
red    = "#ff5f6d"
cyan   = "#4cc9f0"
violet = "#b98aff"
pink   = "#ff7ad6"
blue   = "#5c8dff"
"syn.keyword"  = "#c792ff"
"syn.string"   = "#a5e075"
"syn.number"   = "#ff9e64"
"syn.function" = "#5cd2ff"
"syn.type"     = "#ffcf5c"
"syn.comment"  = "#5c6b7e"
"syn.punct"    = "#89ddff"
"syn.variable" = "#d6dde6"

[light]
effects = { glow = 0, grid = 1 }

[light.component]
"terminal.bg"    = "#f6f4ef"
"terminal.fg"    = "#2b323b"
"thread.card.bg" = "#ffffff"
"gutter.add.fg"  = "#5a9c80"
"text.virtual"   = "fg.faint"
"line.current"   = { color = "alpha(#0a2846, 3.5%)", on = "bg.base" }
"selection"      = { color = "alpha(accent, 36%)", on = "bg.base" }
"text.selection" = "alpha(accent, 36%)"

[light.palette]
bg0 = "#fbfaf7"
bg1 = "#f3f1ec"
bg2 = "#ebe8e1"
bg3 = "#e3dfd6"
bg4 = "#d9d4c9"
line  = "#dcd7cc"
line2 = "#c9c3b6"
fg  = "#1b2129"
fg2 = "#424b57"
fg3 = "#717a86"
fg4 = "#a3a9b1"
accent  = "#0a78a8"
accent2 = "#0a6a96"
ink     = "#ffffff"
brand   = "#ff8a1f"
green  = "#138a5b"
amber  = "#b88200"
red    = "#d1343f"
cyan   = "#d9661a"
violet = "#8645c9"
pink   = "#c43c8c"
blue   = "#3f72e6"
"syn.keyword"  = "#7a3fd1"
"syn.string"   = "#3f7f1a"
"syn.number"   = "#c0560e"
"syn.function" = "#0a6fa3"
"syn.type"     = "#9a6a00"
"syn.comment"  = "#8f969f"
"syn.punct"    = "#0f7f99"
"syn.variable" = "#1b2129"
